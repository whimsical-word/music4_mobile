name: Flutter CI/CD Pipeline

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  analyze_and_test:
    name: Analyze & Unit/Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting & Static Analysis (C4)
        run: flutter analyze

      - name: Run Unit & Widget Tests (C5)
        run: flutter test --coverage

  build_release_apk:
    name: Build Release APK
    needs: analyze_and_test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK (Split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts (C7)
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*.apk
