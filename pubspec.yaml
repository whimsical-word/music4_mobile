name: music4_mobile
description: "PRM393 - Music Streaming Mobile Application (Flutter) with Lean Architecture"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Icons & UI
  cupertino_icons: ^1.0.8

  # State Management (Riverpod)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.4.1

  # Navigation (GoRouter)
  go_router: ^14.6.2

  # Networking (Dio)
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Data Modeling & Immutability
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Audio Playback & Streaming
  just_audio: ^0.10.2
  audio_service: ^0.18.16
  audio_session: ^0.1.21

  # Local Storage & Token Storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Image Caching
  cached_network_image: ^3.4.1

  # Device & Utilities
  connectivity_plus: ^6.1.3
  share_plus: ^10.0.3
  app_links: ^6.4.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  permission_handler: ^13.0.2
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.12
  freezed: ^2.5.7
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0

  # Testing & Mocking
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/icons/
