name: music4_mobile
description: "PRM393 - Music Streaming Mobile Application (Flutter) with Lean Architecture"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  just_audio: ^0.10.2
  audio_service: ^0.18.16
  audio_session: ^0.1.21
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.3
  share_plus: ^10.0.3
  app_links: ^6.4.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  speech_to_text: ^7.5.0
  permission_handler: ^13.0.2
  image_picker: ^1.2.3
  path_provider: ^2.1.5
  just_audio_windows_plus: ^0.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  build_runner: any
  freezed: any
  json_serializable: any
  mocktail: any

dependency_overrides:
  # Ép toàn bộ các bộ sinh code lên bản cao nhất để dịch được Dart 3.13 (tránh lỗi visitDotShorthand)
  # Mà KHÔNG hề đụng chạm đến flutter_riverpod (giữ nguyên bản 2.6.1 cho StateNotifier)
  freezed: ^4.0.2
  freezed_annotation: ^3.1.0
  json_serializable: ^6.14.1
  json_annotation: ^4.12.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true